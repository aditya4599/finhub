[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finsearch"
version = "0.1.0"
description = "Semantic search over financial news with triplet-loss fine-tuned SBERT / FinBERT encoders and FAISS."
readme = "README.md"
requires-python = ">=3.9"
# No license is declared: the original project shipped without a LICENSE file.
# See NOTICE.md before publishing or redistributing.
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0,<5",
    "sentence-transformers>=2.2.2,<6",
    "datasets>=2.14.0,<5",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "tensorboard>=2.14.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7.0", "seaborn>=0.12.0"]
env = ["python-dotenv>=1.0.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[tool.setuptools.packages.find]
include = ["finsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = ["slow: downloads models from the Hugging Face Hub (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
